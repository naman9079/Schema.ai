<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataPilot for Excel</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:0;padding:18px;color:#122033}button{padding:9px 12px;border:0;border-radius:7px;background:#0b6e4f;color:#fff;font-weight:600}textarea{width:100%;min-height:90px;box-sizing:border-box;margin:8px 0;padding:9px}#status{margin:12px 0;color:#536274;line-height:1.4}.warning{background:#fff5d8;padding:9px;border-radius:7px}</style></head><body><h2>DataPilot</h2><p>Select a range, preview it, then explicitly consent before sending data.</p><button id="preview">Preview selected range</button><div id="status">No range previewed.</div><textarea id="question" placeholder="Ask about the selected range…"></textarea><button id="ask" disabled>Ask DataPilot</button><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script src="taskpane.js"></script></body></html>
