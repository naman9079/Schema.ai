<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schema.ai for Excel</title><style>body{font-family:Segoe UI,Arial,sans-serif;margin:0;padding:18px;color:#122033}button{padding:9px 12px;border:0;border-radius:7px;background:#0b6e4f;color:#fff;font-weight:600;margin:4px 0}button:disabled{opacity:.5}textarea{width:100%;min-height:90px;box-sizing:border-box;margin:8px 0;padding:9px}#status{margin:12px 0;color:#536274;line-height:1.4}.warning{background:#fff5d8;padding:9px;border-radius:7px}label{display:block;margin-top:14px;font-size:12px;font-weight:600}</style></head><body><h2>Schema.ai</h2><p>Use a selected range or import a cleaned CSV/JSON file downloaded from the IDE.</p><button id="preview">Preview selected range</button><label for="file-input">Import downloaded file</label><input id="file-input" type="file" accept=".csv,.txt,.json,text/csv,application/json,text/plain" /><div id="status">No range or file imported.</div><textarea id="question" placeholder="Ask about the imported data…"></textarea><button id="write" disabled>Write imported file to sheet</button><button id="ask" disabled>Ask Schema.ai</button><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script src="taskpane.js"></script></body></html>
