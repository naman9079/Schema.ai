<!doctype html>
<html>
<head>
<base target="_top">
<style>
body{font-family:Arial,sans-serif;padding:12px;color:#1f2937}
textarea{width:100%;min-height:90px;box-sizing:border-box;margin:8px 0}
button{padding:8px 10px;border:0;border-radius:6px;background:#0b6e4f;color:#fff;font-weight:600;margin:4px 0;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#preview{white-space:pre-wrap;color:#596579;font-size:12px;margin:12px 0}
#result{background:#f3f4f6;padding:12px;border-radius:6px;margin:12px 0;display:none}
#result.show{display:block}
.formula-box{background:#fff;border:1px solid #d1d5db;padding:8px;border-radius:4px;margin:8px 0;font-family:monospace;font-size:13px}
.warning{background:#fff5d8;padding:8px;border-radius:6px}
.success{background:#d1fae5;color:#065f46;padding:8px;border-radius:6px}
label{display:block;margin-top:12px;font-size:12px;font-weight:600}
.hint{font-size:11px;color:#6b7280;margin-top:4px}
</style>
</head>
<body>
<h2>Schema.ai</h2>
<p>Use a selected range or import a cleaned CSV/JSON file downloaded from the IDE.</p>
<button onclick="previewSelection()">Preview selected range</button>
<label for="fileInput">Import downloaded file</label>
<input id="fileInput" type="file" accept=".csv,.txt,.json,text/csv,application/json,text/plain">
<div id="preview">No range or file previewed.</div>
<textarea id="question" placeholder="Ask: 'What is the average of column A?' or 'Sum column B and put formula in D5'"></textarea>
<div class="hint">💡 You can ask to write formulas to cells like: "average of A1:A10 in F12"</div>
<button id="write" onclick="writeFile()" disabled>Write imported file to sheet</button>
<button id="ask" onclick="ask()" disabled>Ask Schema.ai</button>
<div id="result"></div>
<script>
let payload = null;

function show(text, warning) { 
  const el = document.getElementById('preview'); 
  el.textContent = text; 
  el.className = warning ? 'warning' : ''; 
}

function showResult(result, success) {
  const el = document.getElementById('result');
  el.className = success ? 'show success' : 'show warning';
  el.innerHTML = result;
}

function ready(next, label) { 
  payload = next; 
  document.getElementById('write').disabled = false; 
  document.getElementById('ask').disabled = false; 
  show(label + ': ' + payload.rows.length + ' data rows × ' + payload.headers.length + ' columns. Ready to analyze.', false); 
}

function parseCsv(text) { 
  const rows=[]; let row=[]; let field=''; let quoted=false; 
  for(let i=0;i<text.length;i+=1){
    const c=text[i],n=text[i+1]; 
    if(c==='"'&&quoted&&n==='"'){field+='"';i+=1;} 
    else if(c==='"') quoted=!quoted; 
    else if(c===','&&!quoted){row.push(field);field='';} 
    else if((c==='\n'||c==='\r')&&!quoted){
      if(c==='\r'&&n==='\n')i+=1;
      row.push(field);
      if(row.some(cell=>cell.trim()))rows.push(row);
      row=[];field='';
    } 
    else field+=c;
  } 
  if(field||row.length){row.push(field);if(row.some(cell=>cell.trim()))rows.push(row);} 
  if(rows.length<2)throw new Error('The file needs a header row and at least one data row.'); 
  return {headers:rows[0].map((value,index)=>String(value||'column_'+(index+1)).trim()),rows:rows.slice(1)}; 
}

function importFile(file) { 
  const extension=file.name.toLowerCase().split('.').pop(); 
  const reader=new FileReader(); 
  reader.onload=function(){ 
    try { 
      if(extension==='json'){
        const value=JSON.parse(reader.result);
        if(!Array.isArray(value)||!value.length||value.some(row=>!row||typeof row!=='object'||Array.isArray(row)))
          throw new Error('JSON files must be a non-empty array of objects.');
        const headers=[...new Set(value.flatMap(row=>Object.keys(row)))];
        ready({headers:headers,rows:value.map(row=>headers.map(header=>row[header]??null))},file.name);
      } else if(extension==='csv'||extension==='txt'){
        ready(parseCsv(reader.result),file.name);
      } else throw new Error('Import a CSV, TXT, or JSON file.');
    } catch(error){
      show(error.message,true);
    } 
  }; 
  reader.readAsText(file); 
}

function previewSelection() { 
  google.script.run
    .withSuccessHandler(function(data){ready(data,data.address);})
    .withFailureHandler(function(error){show(error.message,true);})
    .getSelectedRangePayload(); 
}

function writeFile() { 
  if(!payload)return; 
  if(!confirm('Write the imported file into the active sheet starting at A1?'))return; 
  google.script.run
    .withSuccessHandler(function(message){show(message,false);})
    .withFailureHandler(function(error){show(error.message,true);})
    .writePayloadToSheet(payload); 
}

function ask() { 
  if(!payload)return show('Preview a selected range or import a file first.',true); 
  const question=document.getElementById('question').value.trim(); 
  if(!question)return show('Enter a question first.',true); 
  
  show('Analyzing data…',false); 
  showResult('Processing your request...', true);
  
  google.script.run
    .withSuccessHandler(function(result){
      let html = '';
      
      if (result.answer) {
        html += '<strong>Answer:</strong> ' + result.answer + '<br><br>';
      }
      
      if (result.resultValue !== undefined) {
        html += '<strong>Result:</strong> ' + result.resultValue + '<br><br>';
      }
      
      if (result.formula) {
        html += '<div class="formula-box"><strong>Formula:</strong> ' + result.formula + '</div>';
      }
      
      if (result.formulaWritten) {
        html += '<div class="success">✓ Formula written to ' + result.targetCell + '</div>';
      }
      
      if (result.clarification) {
        html += '<strong>Need clarification:</strong> ' + result.clarification;
      }
      
      if (result.message && result.status === 'blocked') {
        html += '<strong>Blocked:</strong> ' + result.message;
      }
      
      showResult(html || 'Schema.ai returned no answer.', !result.clarification && result.status !== 'blocked');
      show('Analysis complete', false);
    })
    .withFailureHandler(function(error){
      showResult('Error: ' + error.message, false);
      show(error.message,true);
    })
    .askSchemaAiWithFormula(question, payload); 
}

document.getElementById('fileInput').addEventListener('change',function(event){
  const file=event.target.files&&event.target.files[0];
  if(file)importFile(file);
});
</script>
</body>
</html>
