<!doctype html><html><head><base target="_top"><style>body{font-family:Arial,sans-serif;padding:12px;color:#1f2937}textarea{width:100%;min-height:90px;box-sizing:border-box;margin:8px 0}button{padding:8px 10px;border:0;border-radius:6px;background:#0b6e4f;color:#fff;font-weight:600;margin:4px 0}button:disabled{opacity:.5}#preview{white-space:pre-wrap;color:#596579;font-size:12px}.warning{background:#fff5d8;padding:8px;border-radius:6px}label{display:block;margin-top:12px;font-size:12px;font-weight:600}</style></head><body><h2>Schema.ai</h2><p>Use a selected range or import a cleaned CSV/JSON file downloaded from the IDE.</p><button onclick="previewSelection()">Preview selected range</button><label for="fileInput">Import downloaded file</label><input id="fileInput" type="file" accept=".csv,.txt,.json,text/csv,application/json,text/plain"><div id="preview">No range or file previewed.</div><textarea id="question" placeholder="Ask about the imported data…"></textarea><button id="write" onclick="writeFile()" disabled>Write imported file to sheet</button><button id="ask" onclick="ask()" disabled>Ask Schema.ai</button><script>
let payload = null;
function show(text, warning) { const el = document.getElementById('preview'); el.textContent = text; el.className = warning ? 'warning' : ''; }
function ready(next, label) { payload = next; document.getElementById('write').disabled = false; document.getElementById('ask').disabled = false; show(label + ': ' + payload.rows.length + ' data rows × ' + payload.headers.length + ' columns. Review before sending.', true); }
function parseCsv(text) { const rows=[]; let row=[]; let field=''; let quoted=false; for(let i=0;i<text.length;i+=1){const c=text[i],n=text[i+1]; if(c==='"'&&quoted&&n==='"'){field+='"';i+=1;} else if(c==='"') quoted=!quoted; else if(c===','&&!quoted){row.push(field);field='';} else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i+=1;row.push(field);if(row.some(cell=>cell.trim()))rows.push(row);row=[];field='';} else field+=c;} if(field||row.length){row.push(field);if(row.some(cell=>cell.trim()))rows.push(row);} if(rows.length<2)throw new Error('The file needs a header row and at least one data row.'); return {headers:rows[0].map((value,index)=>String(value||'column_'+(index+1)).trim()),rows:rows.slice(1)}; }
function importFile(file) { const extension=file.name.toLowerCase().split('.').pop(); const reader=new FileReader(); reader.onload=function(){ try { if(extension==='json'){const value=JSON.parse(reader.result);if(!Array.isArray(value)||!value.length||value.some(row=>!row||typeof row!=='object'||Array.isArray(row)))throw new Error('JSON files must be a non-empty array of objects.');const headers=[...new Set(value.flatMap(row=>Object.keys(row)))];ready({headers:headers,rows:value.map(row=>headers.map(header=>row[header]??null))},file.name);} else if(extension==='csv'||extension==='txt'){ready(parseCsv(reader.result),file.name);} else throw new Error('Import a CSV, TXT, or JSON file.');} catch(error){show(error.message,true);} }; reader.readAsText(file); }
function previewSelection() { google.script.run.withSuccessHandler(function(data){ready(data,data.address);}).withFailureHandler(function(error){show(error.message,true);}).getSelectedRangePayload(); }
function writeFile() { if(!payload)return; if(!confirm('Write the imported file into the active sheet starting at A1?'))return; google.script.run.withSuccessHandler(function(message){show(message,false);}).withFailureHandler(function(error){show(error.message,true);}).writePayloadToSheet(payload); }
function ask() { if(!payload)return show('Preview a selected range or import a file first.',true); const question=document.getElementById('question').value.trim(); if(!question)return show('Enter a question first.',true); if(!confirm('Send only the selected or imported data to Schema.ai?'))return; show('Analyzing selected data…',true); google.script.run.withSuccessHandler(function(result){show(result.answer||result.clarification||result.message||'Schema.ai returned no answer.',false);}).withFailureHandler(function(error){show(error.message,true);}).askSchemaAi(question,payload); }
document.getElementById('fileInput').addEventListener('change',function(event){const file=event.target.files&&event.target.files[0];if(file)importFile(file);});
</script></body></html>
