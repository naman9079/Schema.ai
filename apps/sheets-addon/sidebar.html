<!doctype html><html><head><base target="_top"><style>body{font-family:Arial,sans-serif;padding:12px;color:#1f2937}textarea{width:100%;min-height:90px;box-sizing:border-box;margin:8px 0}button{padding:8px 10px;border:0;border-radius:6px;background:#0b6e4f;color:#fff;font-weight:600;margin:4px 0}#preview{white-space:pre-wrap;color:#596579;font-size:12px}.warning{background:#fff5d8;padding:8px;border-radius:6px}</style></head><body><h2>DataPilot</h2><p>Select a range and preview it before sending.</p><button onclick="preview()">Preview selected range</button><div id="preview">No range previewed.</div><textarea id="question" placeholder="Ask about the selected range…"></textarea><button onclick="ask()">Ask DataPilot</button><script>
let payload = null;
function show(text, warning) { const el = document.getElementById('preview'); el.textContent = text; el.className = warning ? 'warning' : ''; }
function preview() { google.script.run.withSuccessHandler(function (data) { payload = data; show(data.address + ': ' + data.rows.length + ' data rows × ' + data.headers.length + ' columns. Review before sending.', true); }).withFailureHandler(function (error) { show(error.message, true); }).getSelectedRangePayload(); }
async function ask() { if (!payload) return show('Preview a selected range first.', true); const question = document.getElementById('question').value.trim(); if (!question) return show('Enter a question first.', true); if (!confirm('Send only the selected range to DataPilot?')) return; show('The shared backend adapter should be called here with the selected range and the user session.', true); }
</script></body></html>
